<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 624px;
  height: 312px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  position: relative;
  overflow: hidden;
  background: #0f141c;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 36px 40px;
  color: #fff;
}
.glow {
  position: absolute;
  top: -80px;
  right: -60px;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(255, 221, 0, 0.18) 0%, rgba(255, 221, 0, 0) 70%);
  pointer-events: none;
}
.kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #ffdd00;
}
.kicker .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ffdd00;
  box-shadow: 0 0 10px #ffdd00;
}
h1 {
  margin-top: 10px;
  font-size: 34px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: #ffffff;
}
.sub {
  margin-top: 10px;
  font-size: 16px;
  color: #94a3b8;
  line-height: 1.4;
  max-width: 480px;
}
.btn-row {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.bmc-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #ffdd00;
  color: #000000;
  font-weight: 700;
  font-size: 16px;
  padding: 10px 20px;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(255, 221, 0, 0.25);
}
.bmc-badge svg {
  width: 20px;
  height: 20px;
}
.author-tag {
  font-size: 14px;
  color: #64748b;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="kicker"><span class="dot"></span> Open-Source Research</div>
<h1>Support The Guide</h1>
<div class="sub">Help keep this empirical, ROI-ranked knowledge base free and independently maintained.</div>
<div class="btn-row">
  <div class="bmc-badge">
    <svg viewBox="0 0 760 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M125 150h510c25 0 45 20 45 45v210c0 100-80 180-180 180H260C160 585 80 505 80 405V195c0-25 20-45 45-45z" fill="#000"/>
      <path d="M605 235h40c35 0 65 30 65 65s-30 65-65 65h-40v-130z" stroke="#000" stroke-width="40"/>
      <path d="M220 720h320c20 0 35 15 35 35s-15 35-35 35H220c-20 0-35-15-35-35s15-35 35-35z" fill="#000"/>
    </svg>
    Buy Me a Coffee
  </div>
  <div class="author-tag">@Parveen0029</div>
</div>
</body>
</html>
