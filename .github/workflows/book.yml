# Automatically regenerates three formats upon any book updates, published to the permanent release "epub-latest":
#   EPUB:          https://github.com/parveen0029/The-Evidence-Based-Life/releases/download/epub-latest/The-Evidence-Based-Life.epub
#   PDF:           https://github.com/parveen0029/The-Evidence-Based-Life/releases/download/epub-latest/The-Evidence-Based-Life.pdf
#   Offline HTML:  https://github.com/parveen0029/The-Evidence-Based-Life/releases/download/epub-latest/The-Evidence-Based-Life.html
# Pull requests build and validate only without publishing; build artifacts are preserved in GitHub Actions.
name: E-Books

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # Cross-reference verification runs as an independent job to catch broken anchor links early.
  refs:
    name: Cross-Reference Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # Plain-English clarity check: verifies entry lengths, jargon avoidance, and plain-language lines.
  plain:
    name: Plain-English Clarity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # Statistics audit: verifies that entry counts, Grade A/B/C tallies, and link counts match book/ source files.
  stats:
    name: Statistics Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check

  build:
    name: Build E-Book Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: npm ci
        working-directory: tools/epub

      - name: Build EPUB
        run: node tools/epub/build.mjs

      - name: Build Single-File Offline HTML
        run: node tools/offline/build.mjs

      - name: Install Pandoc and Typst
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu fonts-libertinus || sudo apt-get install -y --no-install-recommends fonts-dejavu
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build PDF
        run: node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate EPUB Standard (epubcheck)
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/The-Evidence-Based-Life.epub

      - uses: actions/upload-artifact@v4
        with:
          name: TheEvidenceBasedLife
          path: |
            dist/The-Evidence-Based-Life.epub
            dist/The-Evidence-Based-Life.pdf
            dist/The-Evidence-Based-Life.html

      - name: Publish to Release epub-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="Commit ${GITHUB_SHA::7}, generated on $(date -u +'%Y-%m-%d %H:%M UTC'). Automated build of EPUB, PDF, and single-file offline HTML."
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "E-Books (EPUB / PDF / Offline HTML, Auto-Updated)" --notes "$notes"
          else
            gh release create epub-latest --title "E-Books (EPUB / PDF / Offline HTML, Auto-Updated)" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/The-Evidence-Based-Life.epub \
            dist/The-Evidence-Based-Life.pdf \
            dist/The-Evidence-Based-Life.html --clobber
