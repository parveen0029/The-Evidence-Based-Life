name: "Correction: Inaccurate or Outdated Entry"
description: "Report incorrect numbers, updated regulations, broken source links, or phrasing errors"
title: "Section X, Rule Y: "
labels: ["correction"]
body:
  - type: input
    id: where
    attributes:
      label: Which entry?
      description: Specify the section and rule number, e.g., "Section 32, Rule 2".
      placeholder: Section X, Rule Y
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is inaccurate?
      description: Quote the exact sentence from the text and describe what the correct statement should be.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting Evidence
      description: Direct link to a peer-reviewed journal paper (DOI or PubMed), official statute/regulation, or government agency document. Secondary blog posts, unverified forums, or social media commentary cannot be accepted.
    validations:
      required: true
