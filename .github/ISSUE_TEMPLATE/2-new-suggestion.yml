name: "Content Suggestion: Propose a New Rule or Topic"
description: "Suggest a valuable, evidence-based topic not yet covered in the guide"
labels: ["new-content"]
body:
  - type: markdown
    attributes:
      value: "This handbook strictly includes actionable rules that answer **'What does it cost, and what is the return?'** Every rule must cite peer-reviewed scientific journals or official government agencies. Ideas must be supported by empirical data or verifiable regulations."
  - type: input
    id: topic
    attributes:
      label: Proposed Topic
      placeholder: "e.g., Evaluating career credential certifications"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What specific question should this entry answer?
      description: "Be as concrete as possible, e.g., 'What steps are required, which institutions are involved, and what are the measurable benefits?'"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Known Sources & Citations (Optional)
      description: "Links to academic papers (PubMed/DOI), clinical trials, official statistics, or primary regulatory statutes."
    validations:
      required: false
